services:

  eureka-server:
    build: ./registry
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices

  stock:
    build: ./stock
    container_name: stock
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - microservices

  product:
    build: ./product
    container_name: products
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - microservices

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8090:8090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - microservices

networks:
  microservices:
    driver: bridge