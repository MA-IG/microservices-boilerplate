spring.application.name=registry
server.port=8761

#the next three properties are for the client, but we need them in the server too
#Cuz The Eureka Server library inherits everything from the Eureka Client library
#1- Registry server hostname
eureka.instance.hostname=localhost
#2- means that the application will not retrieve or locally cache the list of registered services from the Eureka server.
eureka.client.fetch-registry=false
#3- means that the application will not announce its presence or register its IP and port with the Eureka server
eureka.client.register-with-eureka=false